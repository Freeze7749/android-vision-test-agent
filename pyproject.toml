[project]
name = "android-vision-test-agent"
version = "0.1.0"
description = "Test Android apps from plain-language test cases with a local vision model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
triage = ["android-bug-triage-agent @ git+https://github.com/Freeze7749/android-bug-triage-agent"]

[project.scripts]
vtest = "vision_test_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
